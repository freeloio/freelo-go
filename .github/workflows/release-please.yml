name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Go preset: bumps `version.go` (const SDKVersion = "...") on
          # every release PR. Drives changelog from conventional commit
          # subjects (feat:, fix:, chore:, ...).
          release-type: go
          package-name: freelo-go
