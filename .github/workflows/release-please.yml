name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Manifest mode: reads release-please-config.json +
      # .release-please-manifest.json. Bumps `version.go` (const
      # SDKVersion, via the x-release-please-version marker) on every
      # release PR. Drives changelog from conventional commit subjects
      # (feat:, fix:, chore:, ...). bump-minor-pre-major keeps breaking
      # changes in the 0.x range until we opt into 1.0.
      - uses: googleapis/release-please-action@v4
