name: Update API Spec

on:
  schedule:
    # Mondays 06:00 UTC — gives reviewers the rest of the week to land
    # any drift PR before the next regen.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      # Generate a short-lived GitHub App token so the PR is created under the
      # App identity instead of GITHUB_TOKEN. PRs opened by GITHUB_TOKEN do not
      # trigger `pull_request` workflows (GitHub anti-recursion), which is why
      # CI was skipped on the weekly spec PRs.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate client from upstream spec
        run: make gen

      - name: Run tests against new client
        run: make test

      - name: Build examples against new client
        run: make examples

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-api-spec
          delete-branch: true
          commit-message: "chore: refresh OpenAPI spec and regenerate client"
          title: "chore: refresh OpenAPI spec and regenerate client"
          body: |
            Automated weekly refresh of the Freelo OpenAPI spec.

            - `spec/freelo-api.yaml` updated to upstream HEAD.
            - `spec/.freelo-api.meta.json` records the new upstream hash and
              the re-sealed hash of the patched spec. Expected in every drift
              PR — `scripts/fetchspec` uses it to answer "did upstream
              change?" on the next run without re-downloading the document.
            - `freeloapi/freeloapi.gen.go` regenerated and patched
              (`time.Time` → `freelotime.Time`).
            - Tests + examples pass against the new client.

            Review the diff for any breaking changes before merging.
          labels: |
            dependencies
            automated
