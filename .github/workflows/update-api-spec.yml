name: Update API Spec

on:
  schedule:
    # Mondays 06:00 UTC — gives reviewers the rest of the week to land
    # any drift PR before the next regen.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate client from upstream spec
        run: make gen

      - name: Run tests against new client
        run: make test

      - name: Build examples against new client
        run: make examples

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-api-spec
          delete-branch: true
          commit-message: "chore: refresh OpenAPI spec and regenerate client"
          title: "chore: refresh OpenAPI spec and regenerate client"
          body: |
            Automated weekly refresh of the Freelo OpenAPI spec.

            - `spec/freelo-api.yaml` updated to upstream HEAD.
            - `freeloapi/freeloapi.gen.go` regenerated and patched
              (`time.Time` → `freelotime.Time`).
            - Tests + examples pass against the new client.

            Review the diff for any breaking changes before merging.
          labels: |
            dependencies
            automated
